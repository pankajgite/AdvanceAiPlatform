spring:
  application:
    name: lovable-clone
    description: this is application

  datasource:
    url: jdbc:postgresql://localhost:5432/advai
    username: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
jwt:
  secretKey : ${JWT_SECRET_KEY}

stripe:
  api:
    secretKey: ${STRIPE_SECRET_KEY}
  webhook:
    secretKey: ${STRIPE_WEBHOOK_SECRET}


client.url: http://localhost:8080
